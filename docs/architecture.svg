<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" font-family="system-ui, 'Apple SD Gothic Neo', 'Segoe UI', sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#94a3b8"/>
    </marker>
    <filter id="ic" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a1c"/>
    </filter>
  </defs>

  <rect width="1240" height="700" fill="#eef1f5" rx="18"/>
  <text x="620" y="66" font-size="32" font-weight="800" fill="#1e293b" text-anchor="middle">채용공고 분석 자동화 구조</text>
  <text x="620" y="96" font-size="17" fill="#7c8ba1" text-anchor="middle">별도 API 키도, 서버도 없다. 쓰던 Claude와 Notion만 있으면 된다.</text>

  <!-- ── 입력 ─────────────────────────────────────── -->
  <text x="70" y="168" font-size="14" font-weight="700" fill="#94a3b8">입력</text>

  <!-- 온디맨드 -->
  <g filter="url(#ic)">
    <rect x="70" y="186" width="250" height="94" rx="12" fill="#ffffff" stroke="#c7d2e0" stroke-width="2.5"/>
  </g>
  <text x="94" y="216" font-size="17" font-weight="700" fill="#334155">공고 URL 또는 본문</text>
  <text x="94" y="244" font-size="14.5" fill="#64748b">/analyze-job — 단건</text>
  <text x="94" y="266" font-size="14.5" fill="#64748b">/process-inbox — 일괄</text>

  <!-- 인박스 -->
  <g filter="url(#ic)">
    <rect x="70" y="330" width="250" height="94" rx="12" fill="#ffffff" stroke="#c7d2e0" stroke-width="2.5"/>
  </g>
  <text x="94" y="360" font-size="17" font-weight="700" fill="#334155">Notion 인박스</text>
  <text x="94" y="388" font-size="14.5" fill="#64748b">바쁠 때 URL만 담아둔 행</text>
  <text x="94" y="410" font-size="14.5" fill="#64748b">상태 = 인박스</text>

  <!-- 예약 -->
  <g filter="url(#ic)">
    <rect x="70" y="474" width="250" height="72" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="6 4"/>
  </g>
  <text x="94" y="504" font-size="17" font-weight="700" fill="#64748b">예약 routine</text>
  <text x="94" y="530" font-size="14.5" fill="#94a3b8">정해진 시각에 인박스 비우기</text>

  <!-- ── 분석 ─────────────────────────────────────── -->
  <text x="446" y="168" font-size="14" font-weight="700" fill="#5b8ada">분석</text>
  <g filter="url(#ic)">
    <rect x="446" y="186" width="286" height="238" rx="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="2.5"/>
  </g>
  <text x="470" y="220" font-size="19" font-weight="700" fill="#1e40af">Claude · MCP 세션</text>
  <text x="470" y="248" font-size="14.5" fill="#2f5d9e">공고를 읽고 구조화 추출</text>

  <line x1="470" y1="266" x2="708" y2="266" stroke="#a9c8f0" stroke-width="1.5"/>

  <text x="470" y="292" font-size="14" fill="#3f6cb0">회사 · 포지션 · 경력</text>
  <text x="470" y="316" font-size="14" fill="#3f6cb0">필수기술 · 우대기술 · 요구역량</text>
  <text x="470" y="340" font-size="14" fill="#3f6cb0">채용전형 · 마감일</text>
  <text x="470" y="364" font-size="14" fill="#3f6cb0">주요업무 요약</text>

  <text x="470" y="400" font-size="13.5" fill="#7c9bc9">추출 규칙은 analysis-spec.md 한 곳에</text>

  <!-- ── 저장 ─────────────────────────────────────── -->
  <text x="858" y="168" font-size="14" font-weight="700" fill="#94a3b8">저장</text>
  <g filter="url(#ic)">
    <rect x="858" y="186" width="312" height="118" rx="12" fill="#ffffff" stroke="#c7d2e0" stroke-width="2.5"/>
  </g>
  <text x="884" y="218" font-size="17" font-weight="700" fill="#334155">Notion 카드</text>
  <text x="884" y="246" font-size="14.5" fill="#64748b">속성 채우기 · 상태를 관심으로</text>
  <text x="884" y="270" font-size="14.5" fill="#64748b">본문에 AI 요약과 원본 공고</text>
  <text x="884" y="292" font-size="13.5" fill="#94a3b8">create-pages / update-page</text>

  <!-- ── 관리 ─────────────────────────────────────── -->
  <text x="858" y="360" font-size="14" font-weight="700" fill="#94a3b8">관리</text>
  <g filter="url(#ic)">
    <rect x="858" y="378" width="312" height="168" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2.5"/>
  </g>
  <text x="884" y="410" font-size="17" font-weight="700" fill="#334155">지원 보드 (칸반)</text>

  <g font-size="13.5" fill="#475569">
    <rect x="884" y="428" width="76" height="26" rx="6" fill="#e2e8f0"/>
    <text x="898" y="446">관심</text>
    <rect x="970" y="428" width="94" height="26" rx="6" fill="#e2e8f0"/>
    <text x="984" y="446">지원예정</text>
    <rect x="1074" y="428" width="94" height="26" rx="6" fill="#e2e8f0"/>
    <text x="1088" y="446">지원완료</text>

    <rect x="884" y="464" width="94" height="26" rx="6" fill="#e2e8f0"/>
    <text x="898" y="482">서류통과</text>
    <rect x="988" y="464" width="94" height="26" rx="6" fill="#e2e8f0"/>
    <text x="1002" y="482">면접진행</text>

    <rect x="884" y="500" width="94" height="26" rx="6" fill="#dcefe0"/>
    <text x="898" y="518" fill="#2f6b40">최종합격</text>
    <rect x="988" y="500" width="76" height="26" rx="6" fill="#f0e0e0"/>
    <text x="1002" y="518" fill="#8a4a4a">불합격</text>
  </g>

  <!-- ── 화살표 ───────────────────────────────────── -->
  <line x1="326" y1="233" x2="440" y2="262" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="326" y1="377" x2="440" y2="326" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M195 474 L195 440" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ar)"/>

  <line x1="738" y1="252" x2="852" y2="240" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="1014" y1="310" x2="1014" y2="372" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- 하단 주석 -->
  <text x="620" y="600" font-size="15" fill="#8494a8" text-anchor="middle">온디맨드와 예약이 같은 추출 스펙을 공유한다. 규칙을 한 곳에서 고치면 양쪽이 같이 바뀐다.</text>
  <text x="620" y="632" font-size="15" fill="#8494a8" text-anchor="middle">칸반·필터·모바일 UI는 Notion이 이미 갖고 있으므로 화면을 새로 만들지 않았다.</text>
</svg>
